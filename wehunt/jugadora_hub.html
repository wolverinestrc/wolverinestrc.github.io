<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Hub – Wolverines TRC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f4f9; --card:#fff; --border:#e5e9f2;
  --navy:#101f3d; --navy2:#16294f; --gold:#FFCB05; --blue:#2563eb; --blue-dk:#1d4ed8; --blue-lt:#eaf1ff;
  --text:#182338; --gray:#67728c; --gray-lt:#a4adc2; --red:#e11d48;
  --shadow:0 1px 2px rgba(16,31,61,0.04), 0 1px 6px rgba(16,31,61,0.05);
}
body{background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--text)}
header{background:var(--navy);padding:20px 24px;display:flex;align-items:center;gap:14px}
header img{width:44px;height:44px;border-radius:50%;background:white;object-fit:contain;padding:4px}
header h1{font-size:17px;font-weight:800;color:white}
header p{font-size:12px;color:#8ea0c4;margin-top:1px}

.wrap{max-width:640px;margin:0 auto;padding:20px 20px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.card + .card{margin-top:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--gray);margin-bottom:14px}

.esq-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.esq-row:first-child{border-top:none}
.esq-icon{width:42px;height:42px;border-radius:10px;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.esq-info{flex:1;min-width:0}
.esq-titulo{font-size:13.5px;font-weight:700}
.esq-meta{font-size:11.5px;color:var(--gray);margin-top:1px}
.esq-desc{font-size:12px;color:var(--gray);margin-top:3px;line-height:1.4}
.esq-ver{background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:800;padding:9px 14px;border-radius:9px;flex-shrink:0}
.esq-ver:hover{background:var(--blue-dk)}

.empty-msg{font-size:13px;color:var(--gray-lt);text-align:center;padding:24px 0}

.hub-logout{display:block;text-align:center;font-size:12px;color:var(--gray);margin-top:16px;cursor:pointer;text-decoration:underline}
.loading-msg{font-size:13px;color:var(--gray);text-align:center;padding:40px 0}

.hub-tabs{max-width:640px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px}
.hub-tab{flex:1;background:var(--card);border:1.5px solid var(--border);color:var(--gray);font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;padding:13px;border-radius:11px;cursor:pointer}
.hub-tab.active{background:var(--navy);border-color:var(--navy);color:white}

.asist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.asist-row:first-child{border-top:none}
.asist-fecha{font-weight:700}
.asist-hora{color:var(--gray);font-size:11.5px}
.tag-retardo{background:#fef3e0;color:#b45309;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px}
.tag-ok{background:#dcfce7;color:#15803d;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:7px}
.motivo-form{display:flex;gap:8px;margin-top:8px}
.motivo-form input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Montserrat',sans-serif;font-size:12.5px;outline:none;background:var(--bg)}
.motivo-form button{background:var(--blue);color:#fff;border:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:8px;cursor:pointer}
.motivo-txt{font-size:11.5px;color:var(--gray);font-style:italic;margin-top:4px}
</style>
</head>
<body>

<header>
  <img src="https://wolverines.mx/IMG_0019_transparent.png" alt="Wolverines" onerror="this.style.display='none'">
  <div>
    <h1 id="hdr-nombre">MI HUB 🏈</h1>
    <p>Portal de jugadora · Wolverines TRC</p>
  </div>
</header>

<div class="hub-tabs">
  <button class="hub-tab active" id="tab-esquemas" onclick="switchTab('esquemas')">📋 Esquemas</button>
  <button class="hub-tab" id="tab-asistencia" onclick="switchTab('asistencia')">✅ Asistencia</button>
</div>

<div class="wrap" id="section-esquemas">
  <div class="card">
    <h2>📋 Esquemas</h2>
    <div class="sub">Jugadas, scouting y video de tu equipo</div>
    <div id="esquemas-content"><div class="loading-msg">Cargando...</div></div>
  </div>
</div>

<div class="wrap" id="section-asistencia" style="display:none">
  <div class="card">
    <h2>✅ Mi asistencia</h2>
    <div class="sub">Tu historial de check-ins a entrenos y partidos</div>
    <div id="asistencia-content"><div class="loading-msg">Cargando...</div></div>
  </div>
</div>

<div class="wrap" style="padding-top:0">
  <div class="hub-logout" onclick="salir()">Cerrar sesión</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://xaawoqyjavqcybafirri.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYXdvcXlqYXZxY3liYWZpcnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mzg4MjcsImV4cCI6MjEwMTExNDgyN30.TdLuimBVQIILaaW0UtZDHDSoDpDomwmL6RbG-K-GDZ0';
const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'wolverines-jugadora-auth' } });

const ICONO_TIPO = { Jugada: '📄', Scout: '📊', Video: '▶️' };

function fmtFecha(f) {
  if (!f) return '';
  var p = f.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function renderEsquemas(rows) {
  var wrap = document.getElementById('esquemas-content');
  if (!rows || !rows.length) {
    wrap.innerHTML = '<div class="empty-msg">Aún no hay esquemas cargados.</div>';
    return;
  }
  wrap.innerHTML = rows.map(function(e) {
    var link = e.tipo === 'Video' ? e.link_externo : e.archivo_url;
    return '<div class="esq-row">' +
      '<div class="esq-icon">' + (ICONO_TIPO[e.tipo] || '📄') + '</div>' +
      '<div class="esq-info">' +
        '<div class="esq-titulo">' + e.titulo + '</div>' +
        '<div class="esq-meta">' + e.tipo + ' · ' + fmtFecha(e.fecha) + '</div>' +
        (e.descripcion ? '<div class="esq-desc">' + e.descripcion + '</div>' : '') +
      '</div>' +
      '<a class="esq-ver" href="' + link + '" target="_blank" rel="noopener">👁 Ver</a>' +
    '</div>';
  }).join('');
}

async function cargarEsquemas() {
  var { data, error } = await sbAuth.from('esquemas').select('*').order('fecha', { ascending: false });
  if (error) {
    document.getElementById('esquemas-content').innerHTML = '<div class="empty-msg">No se pudieron cargar los esquemas.</div>';
    return;
  }
  renderEsquemas(data);
}

function salir() {
  sbAuth.auth.signOut().then(function() { window.location.href = 'jugadora_login.html'; });
}

function switchTab(tab) {
  document.getElementById('tab-esquemas').classList.toggle('active', tab === 'esquemas');
  document.getElementById('tab-asistencia').classList.toggle('active', tab === 'asistencia');
  document.getElementById('section-esquemas').style.display = tab === 'esquemas' ? '' : 'none';
  document.getElementById('section-asistencia').style.display = tab === 'asistencia' ? '' : 'none';
  if (tab === 'asistencia') cargarAsistencia();
}

function fmtFechaLarga(f) {
  var p = f.split('-');
  var dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var d = new Date(p[0] + '-' + p[1] + '-' + p[2] + 'T12:00:00');
  return dias[d.getDay()] + ' ' + p[2] + '/' + p[1] + '/' + p[0];
}

async function enviarMotivoRetardo(fecha, tipoEvento, btnId) {
  var input = document.getElementById('motivo-' + btnId);
  var motivo = input.value.trim();
  if (!motivo) return;
  try {
    var { error } = await sbAuth.rpc('registrar_motivo_retardo', { p_fecha: fecha, p_tipo_evento: tipoEvento, p_motivo: motivo });
    if (error) throw error;
    cargarAsistencia();
  } catch (e) {
    alert('❌ Error: ' + e.message);
  }
}

async function cargarAsistencia() {
  var { data, error } = await sbAuth.from('asistencia').select('*').order('fecha', { ascending: false }).limit(20);
  var wrap = document.getElementById('asistencia-content');
  if (error) { wrap.innerHTML = '<div class="empty-msg">No se pudo cargar tu asistencia.</div>'; return; }
  if (!data.length) { wrap.innerHTML = '<div class="empty-msg">Aún no tienes check-ins registrados.</div>'; return; }
  wrap.innerHTML = data.map(function(a, i) {
    var hora = new Date(a.hora_checkin).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Monterrey' });
    var tagHtml = a.retardo ? '<span class="tag-retardo">Retardo</span>' : '<span class="tag-ok">A tiempo</span>';
    var motivoHtml = '';
    if (a.retardo) {
      motivoHtml = a.motivo_retardo
        ? '<div class="motivo-txt">Motivo: ' + a.motivo_retardo + '</div>'
        : '<div class="motivo-form"><input type="text" id="motivo-' + i + '" placeholder="¿Por qué llegaste tarde?"><button onclick="enviarMotivoRetardo(\'' + a.fecha + '\',\'' + a.tipo_evento + '\',' + i + ')">Enviar</button></div>';
    }
    return '<div class="asist-row" style="flex-direction:column;align-items:stretch">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<span class="asist-fecha">' + fmtFechaLarga(a.fecha) + ' · ' + a.tipo_evento + '</span>' +
        '<span class="asist-hora">' + hora + ' ' + tagHtml + '</span>' +
      '</div>' +
      motivoHtml +
    '</div>';
  }).join('');
}

(async function init() {
  var { data } = await sbAuth.auth.getSession();
  if (!data || !data.session) { window.location.href = 'jugadora_login.html'; return; }
  var meta = data.session.user.user_metadata || {};
  if (meta.id_jugadora) document.getElementById('hdr-nombre').textContent = meta.id_jugadora + ' 🏈';
  cargarEsquemas();
})();
</script>
</body>
</html>
