<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Jugadora – Wolverines TRC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f4f9; --card:#fff; --border:#e5e9f2;
  --navy:#101f3d; --navy2:#16294f; --gold:#FFCB05; --blue:#2563eb; --blue-dk:#1d4ed8; --blue-lt:#eaf1ff;
  --text:#182338; --gray:#67728c; --gray-lt:#a4adc2; --red:#e11d48;
  --shadow:0 1px 2px rgba(16,31,61,0.04), 0 1px 6px rgba(16,31,61,0.05);
}
body{background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--text)}
header{background:var(--navy);padding:20px 24px;display:flex;align-items:center;gap:14px}
header img{width:44px;height:44px;border-radius:50%;background:white;object-fit:contain;padding:4px}
header h1{font-size:17px;font-weight:800;color:white}
header p{font-size:12px;color:#8ea0c4;margin-top:1px}

.wrap{max-width:420px;margin:60px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:26px}
.card h2{font-size:17px;font-weight:800;margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--gray);margin-bottom:20px;line-height:1.5}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.3px;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:12px 13px;font-family:'Montserrat',sans-serif;font-size:15px;color:var(--text);outline:none;background:var(--bg)}
.field input:focus{border-color:var(--blue)}

.submit-btn{width:100%;background:var(--blue);border:none;color:white;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;padding:15px;border-radius:11px;cursor:pointer;margin-top:6px}
.submit-btn:hover{background:var(--blue-dk)}
.submit-btn:disabled{background:var(--gray-lt);cursor:not-allowed}

.alert{border-radius:9px;padding:13px 16px;font-size:12.5px;font-weight:600;margin-top:14px;display:none}
.alert.show{display:block}
.alert.error{background:#fde8ee;color:var(--red)}

.hint{font-size:11.5px;color:var(--gray-lt);margin-top:16px;line-height:1.5;text-align:center}
</style>
</head>
<body>

<header>
  <img src="https://wolverines.mx/IMG_0019_transparent.png" alt="Wolverines" onerror="this.style.display='none'">
  <div>
    <h1>ACCESO JUGADORA 🏈</h1>
    <p>Esquemas y jugadas · Wolverines TRC</p>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>👋 Bienvenida</h2>
    <div class="sub">Entra con tu ID de jugadora y tu fecha de nacimiento para ver tus esquemas</div>
    <div class="field">
      <label>ID de jugadora <span></span></label>
      <input type="text" id="f-id" placeholder="WOLVE01" autocapitalize="characters" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña (fecha de nacimiento DDMMAAAA)</label>
      <input type="password" id="f-pwd" placeholder="02012013" inputmode="numeric" maxlength="8" autocomplete="current-password">
    </div>
    <div class="alert error" id="alert-error"></div>
    <button class="submit-btn" id="btn-entrar" onclick="entrar()">🔑 Entrar</button>
    <div class="hint">Si no tienes tu ID o contraseña, pídelos con tu entrenador/a o con administración.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://xaawoqyjavqcybafirri.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYXdvcXlqYXZxY3liYWZpcnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mzg4MjcsImV4cCI6MjEwMTExNDgyN30.TdLuimBVQIILaaW0UtZDHDSoDpDomwmL6RbG-K-GDZ0';
const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'wolverines-jugadora-auth' } });

function mostrarError(msg) {
  var el = document.getElementById('alert-error');
  if (!msg) { el.classList.remove('show'); return; }
  el.textContent = msg;
  el.classList.add('show');
}

async function entrar() {
  mostrarError('');
  var id = document.getElementById('f-id').value.trim().toUpperCase();
  var pwd = document.getElementById('f-pwd').value.trim();
  if (!id || !pwd) { mostrarError('Escribe tu ID y contraseña.'); return; }

  var btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = '⏳ Entrando...';

  var email = id.toLowerCase() + '@jugadoras.wolverines.mx';
  var { data, error } = await sbAuth.auth.signInWithPassword({ email: email, password: pwd });

  btn.disabled = false; btn.textContent = '🔑 Entrar';

  if (error) {
    mostrarError('ID o contraseña incorrectos. Verifica con tu entrenador/a.');
    return;
  }

  irAlDestino();
}

function irAlDestino() {
  var tokenPendiente = sessionStorage.getItem('wehunt_checkin_token');
  if (tokenPendiente) {
    sessionStorage.removeItem('wehunt_checkin_token');
    window.location.href = 'checkin.html?token=' + encodeURIComponent(tokenPendiente);
  } else {
    window.location.href = 'jugadora_hub.html';
  }
}

document.getElementById('f-pwd').addEventListener('keydown', function(e) { if (e.key === 'Enter') entrar(); });
document.getElementById('f-id').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('f-pwd').focus(); });

(async function checkSesion() {
  var { data } = await sbAuth.auth.getSession();
  if (data && data.session) irAlDestino();
})();
</script>
</body>
</html>
