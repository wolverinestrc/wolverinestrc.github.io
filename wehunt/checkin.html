<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in – Wolverines TRC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f4f9; --card:#fff; --border:#e5e9f2;
  --navy:#101f3d; --blue:#2563eb; --blue-dk:#1d4ed8; --blue-lt:#eaf1ff;
  --text:#182338; --gray:#67728c; --red:#e11d48; --green:#16a34a;
  --shadow:0 1px 2px rgba(16,31,61,0.04), 0 1px 6px rgba(16,31,61,0.05);
}
body{background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--text)}
header{background:var(--navy);padding:20px 24px;display:flex;align-items:center;gap:14px}
header img{width:44px;height:44px;border-radius:50%;background:white;object-fit:contain;padding:4px}
header h1{font-size:17px;font-weight:800;color:white}

.wrap{max-width:420px;margin:50px auto;padding:0 20px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:30px 24px}
.icon{font-size:52px;margin-bottom:14px}
.titulo{font-size:18px;font-weight:900;margin-bottom:8px}
.mensaje{font-size:13.5px;color:var(--gray);line-height:1.6}
.nombre{font-weight:800;color:var(--text)}

.tag-retardo{display:inline-block;background:#fef3e0;color:#b45309;font-size:12px;font-weight:800;padding:5px 12px;border-radius:8px;margin-top:12px}
.tag-ok{display:inline-block;background:#dcfce7;color:#15803d;font-size:12px;font-weight:800;padding:5px 12px;border-radius:8px;margin-top:12px}

.motivo-form{margin-top:18px;text-align:left}
.motivo-form label{display:block;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:6px}
.motivo-form input{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;font-family:'Montserrat',sans-serif;font-size:13.5px;outline:none;background:var(--bg)}
.motivo-form button{width:100%;background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:800;padding:12px;border-radius:9px;cursor:pointer;margin-top:10px}

.btn-hub{display:inline-block;margin-top:22px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800;font-size:13.5px;padding:13px 22px;border-radius:11px}
</style>
</head>
<body>

<header>
  <img src="https://wolverines.mx/IMG_0019_transparent.png" alt="Wolverines" onerror="this.style.display='none'">
  <h1>CHECK-IN 🏈</h1>
</header>

<div class="wrap">
  <div class="card" id="resultado">
    <div class="icon">⏳</div>
    <div class="titulo">Registrando...</div>
    <div class="mensaje">Un momento por favor.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://xaawoqyjavqcybafirri.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYXdvcXlqYXZxY3liYWZpcnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Mzg4MjcsImV4cCI6MjEwMTExNDgyN30.TdLuimBVQIILaaW0UtZDHDSoDpDomwmL6RbG-K-GDZ0';
const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'wolverines-jugadora-auth', persistSession: true, autoRefreshToken: true } });

function mostrar(icon, titulo, mensaje, extraHtml) {
  document.getElementById('resultado').innerHTML =
    '<div class="icon">' + icon + '</div>' +
    '<div class="titulo">' + titulo + '</div>' +
    '<div class="mensaje">' + mensaje + '</div>' +
    (extraHtml || '') +
    '<a class="btn-hub" href="jugadora_hub.html">Ir a mi hub</a>';
}

async function enviarMotivo(fecha, tipoEvento) {
  var motivo = document.getElementById('motivo-input').value.trim();
  if (!motivo) return;
  await sbAuth.rpc('registrar_motivo_retardo', { p_fecha: fecha, p_tipo_evento: tipoEvento, p_motivo: motivo });
  mostrar('⏰', 'Retardo registrado', 'Gracias por avisar, <b class="nombre">' + window.__nombreJugadora + '</b>.', '<span class="tag-retardo">Motivo enviado</span>');
}

(async function init() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  if (!token) { mostrar('❌', 'Falta el código', 'Escanea el código QR que muestra tu coach en pantalla.'); return; }

  var { data: sessionData } = await sbAuth.auth.getSession();
  if (!sessionData || !sessionData.session) {
    sessionStorage.setItem('wehunt_checkin_token', token);
    window.location.href = 'index.html';
    return;
  }

  var { data, error } = await sbAuth.rpc('checkin_con_token', { p_token: token });
  if (error) { mostrar('❌', 'Error', error.message); return; }

  var r = data[0];
  if (!r.ok) { mostrar('❌', 'No se pudo registrar', r.mensaje); return; }

  window.__nombreJugadora = r.nombre;
  if (r.es_retardo) {
    mostrar('⏰', '¡Llegaste tarde!', 'Hola <b class="nombre">' + r.nombre + '</b>, registramos tu llegada con retardo.',
      '<span class="tag-retardo">Retardo</span>' +
      '<div class="motivo-form">' +
        '<label>¿Por qué llegaste tarde? (opcional)</label>' +
        '<input type="text" id="motivo-input" placeholder="Ej. Tráfico, permiso de la escuela...">' +
        '<button onclick="enviarMotivo(\'' + r.fecha + '\',\'' + r.tipo_evento + '\')">Enviar motivo</button>' +
      '</div>');
  } else {
    mostrar('✅', '¡Asistencia registrada!', 'Hola <b class="nombre">' + r.nombre + '</b>, quedaste registrada a tiempo.',
      '<span class="tag-ok">A tiempo</span>');
  }
})();
</script>
</body>
</html>
