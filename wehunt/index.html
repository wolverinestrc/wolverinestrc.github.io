<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeHunt – Wolverines TRC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f4f9; --card:#fff; --border:#e5e9f2;
  --navy:#101f3d; --navy2:#16294f; --gold:#FFCB05; --blue:#2563eb; --blue-dk:#1d4ed8; --blue-lt:#eaf1ff;
  --text:#182338; --gray:#67728c; --gray-lt:#a4adc2;
  --shadow:0 1px 2px rgba(16,31,61,0.04), 0 1px 6px rgba(16,31,61,0.05);
}
body{background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--text)}
header{background:var(--navy);padding:20px 24px;display:flex;align-items:center;gap:14px}
header img{width:44px;height:44px;border-radius:50%;background:white;object-fit:contain;padding:4px}
header h1{font-size:17px;font-weight:800;color:white}
header p{font-size:12px;color:#8ea0c4;margin-top:1px}

.wrap{max-width:460px;margin:60px auto;padding:0 20px}
.title{font-size:19px;font-weight:800;text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:28px}

.opcion{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;text-decoration:none;color:var(--text)}
.opcion + .opcion{margin-top:14px}
.opcion:hover{border-color:var(--blue)}
.opcion .icon{font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opcion .info b{display:block;font-size:15px;font-weight:800}
.opcion .info span{font-size:12.5px;color:var(--gray)}
</style>
</head>
<body>

<header>
  <img src="https://wolverines.mx/IMG_0019_transparent.png" alt="Wolverines" onerror="this.style.display='none'">
  <div>
    <h1>WEHUNT 🏈</h1>
    <p>Esquemas y jugadas · Wolverines TRC</p>
  </div>
</header>

<div class="wrap">
  <div class="title">¿Quién eres?</div>
  <div class="sub">Selecciona tu tipo de acceso</div>

  <a class="opcion" href="jugadora_login.html">
    <div class="icon">🏈</div>
    <div class="info"><b>Soy jugadora</b><span>Ver esquemas, jugadas y video</span></div>
  </a>
  <a class="opcion" href="coach_login.html">
    <div class="icon">🧑‍🏫</div>
    <div class="info"><b>Soy coach</b><span>Subir y administrar esquemas</span></div>
  </a>
</div>

</body>
</html>
