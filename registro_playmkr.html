<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro – Playmkr Summer Camp 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;600;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #070f1e;
    --navy2:   #0d1f3c;
    --card:    #111d36;
    --lite:    #162545;
    --gold:    #FFCB05;
    --gold-dk: #d4a800;
    --white:   #ffffff;
    --gray:    #8899bb;
    --light:   #ccdaff;
  }

  body {
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    color: var(--white);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: var(--navy2);
    border-bottom: 3px solid var(--gold);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-text h1 {
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .header-text p {
    font-size: 12px;
    color: var(--gray);
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .container {
    max-width: 560px;
    margin: 60px auto 0;
    padding: 0 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--lite);
    border-top: 3px solid var(--gold);
    padding: 48px 28px;
    border-radius: 2px;
    text-align: center;
  }
  .card .icon { font-size: 48px; margin-bottom: 16px; }
  .card h2 { color: var(--gold); font-size: 22px; font-weight: 900; margin-bottom: 12px; }
  .card p { color: var(--light); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .card a {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 900;
    padding: 14px 28px;
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 13px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="header-text">
    <h1>PLAYMKR 🏈</h1>
    <p>Summer Camp 2026 · Registro</p>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="icon">🏈</div>
    <h2>Inscripciones cerradas</h2>
    <p>El Summer Camp 2026 ya concluyó y este registro ya no está disponible.<br>Si buscas inscribir a tu jugador a la Temporada 2026 de Wolverines TRC, visita el registro oficial.</p>
    <a href="/temporada2026/index.html">Ir al registro de Temporada 2026</a>
  </div>
</div>

</body>
</html>
