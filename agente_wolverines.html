let wlvHistory = [];
let wlvOpen = false;
let wlvBadgeShown = true;

function wlvToggleChat() {
  const panel = document.getElementById('wlv-chat-panel');
  const badge = document.querySelector('#wlv-chat-btn .badge');
  wlvOpen = !wlvOpen;
  panel.classList.toggle('open', wlvOpen);
  if (wlvOpen && wlvBadgeShown) {
    badge.style.display = 'none';
    wlvBadgeShown = false;
    setTimeout(() => wlvAddMsg('bot',
      '¡Hola! 👋 Soy **Wolvy**, tu asistente de Wolverines TRC.\n\n¿En qué puedo ayudarte hoy?'
    ), 400);
    setTimeout(() => wlvShowQR([
      '¿Qué es el Summer Camp?',
      '¿Cuáles son los precios?',
      '¿Qué categorías hay?',
      'Quiero inscribir a mi hijo',
    ]), 600);
  }
}

function wlvTime() {
  return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

function wlvAddMsg(role, text) {
  const msgs = document.getElementById('wlv-msgs');
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `wlv-msg ${isUser ? 'user' : ''}`;

  const formatted = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  div.innerHTML = `
    <div class="wlv-msg-avatar" style="${isUser ? '' : 'background:white;'}">${isUser ? '👤' : '<img src="https://wolverines.mx/IMG_0019.png.jpeg" alt="W" style="width:22px;height:22px;object-fit:contain;">'}</div>
    <div>
      <div class="wlv-msg-bubble">${formatted}</div>
      <div class="wlv-msg-time">${wlvTime()}</div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function wlvShowTyping() {
  const msgs = document.getElementById('wlv-msgs');
  const div = document.createElement('div');
  div.className = 'wlv-msg'; div.id = 'wlv-typing';
  div.innerHTML = `<div class="wlv-msg-avatar">🏈</div><div class="wlv-typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function wlvHideTyping() {
  const t = document.getElementById('wlv-typing');
  if (t) t.remove();
}

function wlvShowQR(options) {
  const container = document.getElementById('wlv-qr-container');
  container.innerHTML = options.map(o =>
    `<button class="wlv-qr" onclick="wlvSendText('${o}')">${o}</button>`
  ).join('');
}

function wlvSendText(text) {
  document.getElementById('wlv-input').value = text;
  wlvSend();
}

async function wlvSend() {
  const input = document.getElementById('wlv-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('wlv-qr-container').innerHTML = '';
  document.getElementById('wlv-send-btn').disabled = true;

  wlvAddMsg('user', text);
  wlvHistory.push({ role: 'user', content: text });

  wlvShowTyping();

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 500,
        system: SYSTEM_PROMPT,
        messages: wlvHistory
      })
    });

    const data = await res.json();
    if (data.error) {
      wlvHideTyping();
      wlvAddMsg('bot', '⚠️ Error: ' + (data.error.message || 'Verifica la conexión') + ' · Llama al 871 342 0040 🏈');
      document.getElementById('wlv-send-btn').disabled = false;
      return;
    }
    const reply = data.content?.[0]?.text || 'Lo siento, intenta de nuevo.';
    wlvHistory.push({ role: 'assistant', content: reply });

    wlvHideTyping();

    // Check if registration data is ready
    if (reply.includes('REGISTRAR:')) {
      const dataStr = reply.split('REGISTRAR:')[1].split('\n')[0];
      const [nombre, apellidos, genero, fecha_nac, tutor, telefono, email, paquete] = dataStr.split(',').map(s => s.trim());

      const cleanReply = reply.replace(/REGISTRAR:.*/, '').trim();
      if (cleanReply) wlvAddMsg('bot', cleanReply);

      await wlvRegister({ nombre, apellidos, genero, fecha_nac, tutor, telefono, email, paquete });
    } else {
      wlvAddMsg('bot', reply);
    }

  } catch(e) {
    wlvHideTyping();
    console.error('Wolvy error:', e);
    wlvAddMsg('bot', 'Lo siento, hubo un problema de conexión. Por favor intenta de nuevo o llama al 871 342 0040 🏈');
  }

  document.getElementById('wlv-send-btn').disabled = false;
  document.getElementById('wlv-input').focus();
}

async function wlvRegister(data) {
  try {
    // Determine category from birthdate
    const dob = new Date(data.fecha_nac);
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
    const categoria = (age >= 4 && age <= 12)
      ? 'Infantil (4–12 años) · 6:30–8:00 pm'
      : 'Juvenil (13+ años) · 7:00–8:30 pm';
    // Validate date is parseable; if not, omit it
    const validDate = !isNaN(dob.getTime());

    const { error } = await supabase.from('jugadores_summer_camp').insert({
      nombre: data.nombre,
      apellidos: data.apellidos,
      genero: data.genero,
      fecha_nacimiento: validDate ? data.fecha_nac : null,
      categoria: categoria,
      tutor: data.tutor,
      telefono: data.telefono,
      email: data.email,
      paquete: data.paquete,
      fecha_registro: new Date().toISOString().split('T')[0],
      pago: 'Pendiente',
    });

    if (!error) {
      wlvAddMsg('bot',
        `🎉 ¡**${data.nombre}** quedó registrado correctamente en Wolverines TRC Summer Camp 2026!\n\n` +
        `📋 **Categoría:** ${categoria}\n` +
        `💰 **Paquete:** ${data.paquete}\n\n` +
        `Te contactaremos al **${data.telefono}** para coordinar el pago. ¡Nos vemos en el campo! 🏈`
      );
      wlvShowQR(['¿Cuáles son los métodos de pago?', 'Registrar otro jugador', 'Hablar con un asesor']);
    } else {
      throw error;
    }
  } catch(e) {
    wlvAddMsg('bot', '⚠️ Error al guardar: ' + e.message + ' · Llama al 871 342 0040.');
  }
}
</script>
