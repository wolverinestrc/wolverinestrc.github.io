<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos · Wolverines TRC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f1f4f9; --card: #fff; --border: #e5e9f2;
    --navy: #101f3d; --navy2: #16294f;
    --blue: #2563eb; --blue-dk: #1d4ed8; --blue-lt: #eaf1ff;
    --text: #182338; --gray: #67728c; --gray-lt: #a4adc2;
    --gold: #FFCB05;
    --orange: #f59e0b; --orange-lt: #fef3e0;
    --shadow: 0 1px 2px rgba(16,31,61,0.04), 0 1px 6px rgba(16,31,61,0.05);
  }

  body { background: var(--bg); font-family: 'Montserrat', sans-serif; color: var(--text); min-height: 100vh; padding-bottom: 60px; }

  header {
    background: var(--navy);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 3px solid var(--gold);
  }
  header img { width: 44px; height: 44px; border-radius: 50%; background: white; object-fit: contain; padding: 4px; }
  header h1 { font-size: 17px; font-weight: 800; color: white; letter-spacing: 0.2px; }
  header p { font-size: 12px; color: #8ea0c4; margin-top: 1px; }

  .hero { padding: 28px 20px 4px; max-width: 640px; margin: 0 auto; text-align: center; }
  .hero h2 { font-size: 21px; font-weight: 900; color: var(--navy); line-height: 1.4; }
  .hero p { font-size: 13px; color: var(--gray); margin-top: 8px; line-height: 1.6; }

  .container { max-width: 640px; margin: 24px auto 0; padding: 0 20px; }

  .dia-titulo {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--navy); margin: 28px 0 14px;
  }
  .dia-titulo:first-child { margin-top: 0; }
  .dia-titulo::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .juego-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 18px;
  }
  .juego-card.pospuesto { border-left-color: var(--orange); }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 20px; white-space: nowrap; }
  .badge-cat { background: var(--blue-lt); color: var(--blue-dk); }
  .badge-pospuesto { background: var(--orange-lt); color: var(--orange); }

  .juego-badges { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }

  .juego-partido { font-size: 16px; font-weight: 800; color: var(--navy); width: 100%; }

  .juego-detalles { display: flex; flex-wrap: wrap; gap: 4px 20px; width: 100%; font-size: 13px; color: var(--gray); }
  .juego-detalle { display: flex; align-items: center; gap: 6px; }
  .juego-detalle b { color: var(--text); font-weight: 700; }

  .vacio {
    text-align: center; color: var(--gray); font-size: 13px; padding: 40px 20px;
    background: var(--card); border: 1px dashed var(--border); border-radius: 12px;
  }

  footer { text-align: center; color: var(--gray-lt); font-size: 11px; margin-top: 40px; padding: 0 20px; }
</style>
</head>
<body>

<header>
  <img src="https://wolverines.mx/IMG_0019_transparent.png" alt="W" onerror="this.style.display='none'">
  <div>
    <h1>Wolverines TRC · Juegos</h1>
    <p>Calendario de la semana</p>
  </div>
</header>

<div class="hero">
  <h2>Calendario de juegos</h2>
  <p>Consulta categoría, hora, campo y sede de los juegos de viernes y sábado en cada liga.</p>
</div>

<div class="container" id="juegos-container"></div>

<footer>Wolverines TRC · Este calendario se actualiza cada semana</footer>

<script>
/*
 * Actualiza este arreglo cada semana con los juegos.
 * dia: 'Viernes' o 'Sábado'
 * hora: formato 24h "HH:MM" para que ordene bien (ej. "17:30") — omite hora/campo y pon pospuesto:true si aún no hay horario confirmado
 * partido: "Equipo A vs Equipo B"
 * liga: opcional, déjalo fuera si no aplica
 * pospuesto: true si el juego se reprogramó y todavía no tiene nueva fecha/hora confirmada
 */
const JUEGOS = [
  { dia: 'Viernes', categoria: 'U15 Femenil', partido: 'Wolverines Azul vs Borregas Laguna', hora: '18:00', campo: 'Campo 1', sede: 'Tec de Monterrey' },
  { dia: 'Viernes', categoria: 'U17 Femenil', partido: 'Wolverines Azul vs UAD Torreón', hora: '19:00', campo: 'Campo 2', sede: 'Tec de Monterrey' },
  { dia: 'Viernes', categoria: 'U17 Femenil', partido: 'Borregas Laguna vs Wolverines Blanco', hora: '20:00', campo: 'Campo 1', sede: 'Tec de Monterrey' },
  { dia: 'Viernes', categoria: 'U15 Femenil', partido: 'Wolverines Blanco vs Lucky Charms', pospuesto: true },
  { dia: 'Viernes', categoria: 'Femenil Invierno 2026', partido: 'Patriots vs Wolverines', pospuesto: true },
];

const DIAS_ORDEN = ['Viernes', 'Sábado'];

function renderJuegos() {
  const cont = document.getElementById('juegos-container');

  if (!JUEGOS.length) {
    cont.innerHTML = '<div class="vacio">Todavía no hay juegos programados para esta semana.</div>';
    return;
  }

  let html = '';
  DIAS_ORDEN.forEach(function(dia) {
    const juegosDia = JUEGOS.filter(function(j) { return j.dia === dia; })
      .sort(function(a, b) {
        if (!!a.pospuesto !== !!b.pospuesto) return a.pospuesto ? 1 : -1;
        return (a.hora || '').localeCompare(b.hora || '');
      });
    if (!juegosDia.length) return;

    html += '<div class="dia-titulo">📅 ' + dia + '</div>';
    juegosDia.forEach(function(j) {
      var badges = (j.liga ? '<span class="badge badge-cat">' + j.liga + '</span>' : '') +
        (j.categoria ? '<span class="badge badge-cat">' + j.categoria + '</span>' : '') +
        (j.pospuesto ? '<span class="badge badge-pospuesto">⏸ Pospuesto</span>' : '');

      var detalles = j.pospuesto
        ? '<span class="juego-detalle">Se reprogramó — todavía sin nueva fecha/hora confirmada</span>'
        : '<span class="juego-detalle">🕐 <b>' + (j.hora || '—') + '</b></span>' +
          '<span class="juego-detalle">🏟️ <b>' + (j.campo || '—') + '</b></span>' +
          '<span class="juego-detalle">📍 ' + (j.sede || '—') + '</span>';

      html += '<div class="juego-card' + (j.pospuesto ? ' pospuesto' : '') + '">' +
        (badges ? '<div class="juego-badges">' + badges + '</div>' : '') +
        '<div class="juego-partido">' + (j.partido || '') + '</div>' +
        '<div class="juego-detalles">' + detalles + '</div>' +
      '</div>';
    });
  });

  cont.innerHTML = html || '<div class="vacio">Todavía no hay juegos programados para esta semana.</div>';
}

renderJuegos();
</script>
</body>
</html>
